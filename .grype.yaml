scan-type: source
ignore:
  - vulnerability: GHSA-fc5q-39xc-vjpf
    include-aliases: true
    reason: >-
      Unfixable npm transitive vulnerability: picomatch <=4.0.7 (high severity), no patched release as of 2026-11-18.
      Only runtime use is require-glob with a fixed pattern; remove once picomatch publishes a fix
output:
  - table
  - json
search:
  scope: squashed
quiet: false
check-for-app-update: false
