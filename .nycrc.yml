temp-directory: "./.nyc_output"
# Cache must be disabled for ts-node transpilation to work correctly with nyc.
cache: false
check-coverage: true
per-file: true
lines: 90
statements: 90
functions: 90
branches: 90
all: true
include: [
  "src/**/*.js",
  "src/**/*.ts"
]
extension: [
  ".js",
  ".ts"
]
reporter: [
  "lcov",
  "text-summary"
]
exclude: [
  "**/node_modules/**",
  '**/migrations/**',
  '**/ddl/**',
  '**/bulk*/**',
  'src/shared/logger/**',
  'src/shared/loggingPlugin.js',
  'src/shared/constants.js',
  'src/domain/position/index.js',
  'src/domain/position/binProcessor.js',
  'src/handlers/positions/handler.js',
