## Add a comment indicating the reason for each rejected dependency upgrade added to this list.
reject: [
  # tape 5.x enforces strict .end() ordering: seven forEach(async ...) loops in
  # test/unit/domain/participant/index.test.js are never awaited, so their assertions land after
  # assert.end() (16 failures on 5.10.3, re-tested 2026-10-20); awaiting them exposes three tests
  # (getById, update, ...) whose bodies never ran. Needs a test fix before the tape 5 move.
  "tape",
  # ilp-packet >2.2.0 (3.x is currently an alpha prerelease) implements a newer ILP packet format
  # that is not compatible with the Mojaloop Specification.
  "ilp-packet",
  # central-services-logger 12.x is a major release. central-services-shared 19.0.0 (and
  # central-services-health and other Mojaloop libs) still declare a logger 11.x.x peer, so
  # npm can't resolve 12.x. Remove once those libraries release with logger 12 support.
  "@mojaloop/central-services-logger"
]
