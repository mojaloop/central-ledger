## Add a comment indicating the reason for each rejected dependency upgrade added to this list.
reject: [
  # tape 5.x enforces strict .end()/plan semantics that break this repo's stream-style event tests
  # (verified against the tape 5.10.x line); the suite also runs under the tapes wrapper, which is bound to tape 4.
  "tape",
  # ilp-packet >2.2.0 (3.x is currently an alpha prerelease) implements a newer ILP packet format
  # that is not compatible with the Mojaloop Specification.
  "ilp-packet",
  # database-lib 11.3.8 regression (verified 2026-07-07): Table._addWhere now runs `assert(value)` on every
  # criteria value, so legitimate falsy filters throw, e.g. transferExtension.getByTransferId's
  # { isFulfilment: false, isError: false } fails with "AssertionError [ERR_ASSERTION]: The expression
  # evaluated to a falsy value: assert(value)" (@mojaloop/database-lib/src/table.js:111). Hold at 11.3.7
  # until the upstream assert is fixed to allow falsy (non-undefined/null) criteria values.
  "@mojaloop/database-lib"
]
