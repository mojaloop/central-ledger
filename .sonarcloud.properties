# SonarCloud's Automatic Analysis reads this file, not sonar-project.properties.
# Analyse the test suites as tests: the tape suites under test/, and the node:test suites that live
# next to the code under src/ (*.int.ts, *.unit.ts). Without it they are analysed as production source
# and their repeated stub scaffolding counts towards the duplication metrics.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=test/**,src/**/*.int.ts,src/**/*.unit.ts
sonar.exclusions=test/**,src/**/*.int.ts,src/**/*.unit.ts
